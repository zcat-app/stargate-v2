quarkus.http.host=127.0.0.1
quarkus.http.port=9080
quarkus.http.proxy.proxy-address-forwarding=false
quarkus.http.limits.max-body-size=1K
quarkus.http.access-log.enabled=false
quarkus.http.enable-compression=false
quarkus.http.enable-decompression=false
quarkus.http.http2=false
quarkus.banner.enabled=false
quarkus.analytics.disabled=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] %s%e%n
