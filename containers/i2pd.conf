# Public I2P network; no destination-bearing upstream logs.
loglevel = none
netid = 2
notransit = true
bandwidth = O
ipv6 = false
[http]
enabled = false
[httpproxy]
enabled = false
[socksproxy]
enabled = true
address = 0.0.0.0
port = 4447
keys = shareddest
outproxy.enabled = false
[sam]
enabled = false
[bob]
enabled = false
[i2cp]
enabled = false
[upnp]
enabled = false
[i2pcontrol]
enabled = true
address = 0.0.0.0
port = 7650
cert = /run/i2p-control/control.crt
key = /var/lib/i2pd/control.key
